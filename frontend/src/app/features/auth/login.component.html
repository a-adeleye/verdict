<section class="login">
  <div class="card login-card">
    <h1>Sign in to Verdict</h1>
    <p class="text-muted">Experience passwordless email magic link or continue with Google.</p>
    <form (ngSubmit)="onSendMagicLink()">
      <label>Email address</label>
      <input type="email" required [(ngModel)]="email" name="email" placeholder="you@example.com" />
      <button class="button-primary" type="submit">Send magic link</button>
    </form>
    <div class="divider"><span>or</span></div>
    <button class="button-secondary" (click)="onGoogleLogin()">Continue with Google</button>
  </div>

  <div class="mock-login card">
    <h2>Phase 1 mock accounts</h2>
    <p class="text-muted">Quickly switch roles for testing flows.</p>
    <ul>
      <li *ngFor="let user of (users$ | async)">
        <div>
          <span class="name">{{ user.displayName }}</span>
          <span class="role">{{ user.role }}</span>
        </div>
        <button class="button-secondary" (click)="loginAs(user.id)">Log in</button>
      </li>
    </ul>
  </div>
</section>
